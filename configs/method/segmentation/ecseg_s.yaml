# EdgeCrafter ECSeg-S (COCO segmentation).

title: "ECSeg-S"
task: segmentation

model:
  model_name: ecseg
  backbone_name: ecvit_s
  ncls: 80
  backbone_ckps: null
  finetuning: True

trainer:
  epochs: 72
  save_path: outputs/ecseg_s
  valid_term: 5
  save_term: 5

method:
  task: segmentation

  ECSeg:
    backbone: ViTAdapter
    encoder: HybridEncoder
    decoder: ECTransformer

  ViTAdapter:
    name: ecseg_vits
    embed_dim: 384
    num_heads: 6
    interaction_indexes: [10, 11]
    weights_path: null
    skip_load_backbone: True
    proj_dim: 256

  HybridEncoder:
    in_channels: [384, 384, 384]
    feat_strides: [8, 16, 32]
    hidden_dim: 256
    use_encoder_idx: [2]
    num_encoder_layers: 1
    nhead: 8
    dim_feedforward: 1024
    dropout: 0.0
    expansion: 1.0
    depth_mult: 1
    act: silu
    csp_type: csp2
    fuse_op: sum

  ECTransformer:
    feat_channels: [256, 256, 256]
    feat_strides: [8, 16, 32]
    hidden_dim: 256
    num_levels: 3
    num_layers: 6
    eval_idx: -1
    num_queries: 300
    num_denoising: 100
    label_noise_ratio: 0.5
    box_noise_scale: 1.0
    reg_max: 32
    reg_scale: 4
    layer_scale: 1
    num_points: [3, 6, 3]
    cross_attn_method: default
    query_select_method: default
    activation: silu
    dim_feedforward: 2048
    num_classes: 80
    mask_downsample_ratio: 4

  ECCriterion:
    weight_dict: {loss_mal: 2.0, loss_bbox: 1, loss_giou: 1, loss_fgl: 0.15, loss_ddf: 1.5, loss_mask_ce: 5.0, loss_mask_dice: 5.0}
    losses: [mal, boxes, local, masks]
    gamma: 1.5
    alpha: 0.75
    reg_max: 32
    matcher:
      type: HungarianMatcher
      weight_dict: {cost_class: 2, cost_bbox: 1, cost_giou: 1, cost_mask_ce: 5, cost_mask_dice: 5}
      alpha: 0.25
      gamma: 2.0
      mask_point_sample_ratio: 16

  PostProcessor:
    num_top_queries: 300
    num_classes: 80


kd:
  enabled: False

# === EC pipeline blocks ===

optimizer:
  type: AdamW
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.0001
  params:
    - {params: '^(?=.*backbone)(?!.*(?:norm|bn|bias)).*$', lr: 0.000025}
    - {params: '^(?=.*backbone)(?=.*(?:norm|bn|bias)).*$', lr: 0.000025, weight_decay: 0.0}
    - {params: '^(?!.*backbone)(?=.*(?:norm|bn|bias)).*$', weight_decay: 0.0}

lr_scheduler:
  type: MultiStepLR
  milestones: [5000]
  gamma: 0.5

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500

ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000
  start: 0

scaler:
  type: GradScaler
  enabled: False

use_amp: True
use_ema: True
clip_max_norm: 0.1
print_freq: 200
checkpoint_freq: 5
sync_bn: True
find_unused_parameters: False

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', 'segm']
  verbose: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: data/coco/train2017
    ann_file: data/coco/annotations/instances_train2017.json
    return_masks: True
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: ~
    stop_epoch: 72
  shuffle: True
  total_batch_size: 32
  num_workers: 4

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: data/coco/val2017
    ann_file: data/coco/annotations/instances_val2017.json
    return_masks: True
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
  shuffle: False
  total_batch_size: 64
  num_workers: 4

