# EdgeCrafter ECPose-T (COCO 17-kpt).

title: "ECPose-T"
task: pose

model:
  model_name: ecpose
  backbone_name: ecvit_t
  nkpts: (17, 3)
  ncls: 1
  backbone_ckps: null
  finetuning: True

trainer:
  epochs: 92
  save_path: outputs/ecpose_t
  valid_term: 5
  save_term: 5

method:
  task: pose

  ECPose:
    backbone: ViTAdapter
    encoder: HybridEncoder
    decoder: DETRTransformer

  ViTAdapter:
    name: ecpose_vitt
    embed_dim: 192
    num_heads: 3
    interaction_indexes: [10, 11]
    weights_path: null
    skip_load_backbone: True
    proj_dim: 256

  HybridEncoder:
    in_channels: [192, 192, 192]
    feat_strides: [8, 16, 32]
    hidden_dim: 256
    use_encoder_idx: [2]
    num_encoder_layers: 1
    nhead: 8
    dim_feedforward: 1024
    dropout: 0.0
    expansion: 1.0
    depth_mult: 1
    act: silu
    csp_type: csp2
    fuse_op: sum

  DETRTransformer:
    hidden_dim: 256
    dropout: 0.0
    nhead: 8
    num_queries: 60
    dim_feedforward: 1024
    num_decoder_layers: 6
    normalize_before: False
    return_intermediate_dec: True
    activation: relu
    num_feature_levels: 3
    dec_n_points: 4
    learnable_tgt_init: True
    two_stage_type: standard
    num_body_points: 17
    aux_loss: True
    feat_strides: [8, 16, 32]
    reg_max: 32
    reg_scale: 4

  DETRPoseCriterion:
    num_classes: 2
    weight_dict: {loss_vfl: 2.0, loss_keypoints: 10.0, loss_oks: 4.0}
    focal_alpha: 0.25
    losses: [vfl, keypoints]
    matcher:
      type: DETRPoseHungarianMatcher
      cost_class: 2.0
      cost_keypoints: 10.0
      cost_oks: 4.0
      focal_alpha: 0.25
    num_body_points: 17

  DETRPosePostProcessor:
    num_select: 60
    num_body_points: 17


kd:
  enabled: False

# === EC pipeline blocks ===

optimizer:
  type: AdamW
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.0001
  params:
    - {params: '^(?=.*backbone)(?!.*(?:norm|bn|bias)).*$', lr: 0.000025}
    - {params: '^(?=.*backbone)(?=.*(?:norm|bn|bias)).*$', lr: 0.000025, weight_decay: 0.0}
    - {params: '^(?!.*backbone)(?=.*(?:norm|bn|bias)).*$', weight_decay: 0.0}

lr_scheduler:
  type: MultiStepLR
  milestones: [5000]
  gamma: 0.5

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500

ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000
  start: 0

scaler:
  type: GradScaler
  enabled: False

use_amp: True
use_ema: True
clip_max_norm: 0.1
print_freq: 200
checkpoint_freq: 5
sync_bn: True
find_unused_parameters: False

evaluator:
  type: CocoEvaluator
  iou_types: ['keypoints']
  verbose: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: data/coco/train2017
    ann_file: data/coco/annotations/person_keypoints_train2017.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: ~
    stop_epoch: 72
  shuffle: True
  total_batch_size: 32
  num_workers: 4

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: data/coco/val2017
    ann_file: data/coco/annotations/person_keypoints_val2017.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
  shuffle: False
  total_batch_size: 64
  num_workers: 4

