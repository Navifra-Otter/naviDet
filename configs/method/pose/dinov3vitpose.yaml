# DINOv3 ViT-Small backbone inside the EC pipeline.
# Pallet dataset (4-keypoint, 11 classes) for ablation against ecvit_s_pallet.

title: "DINOv3-ViT-S Pose (pallet, ablation)"
task: pose
seed: 42

model:
  model_name: dinov3_pose
  backbone_name: dinov3_vit_small
  nkpts: (4, 3)
  ncls: 11
  backbone_ckps: null
  finetuning: True

trainer:
  epochs: 100
  save_path: outputs/dinov3_vit_s_pose
  valid_term: 1
  save_term: 10
  early_stopping:
    enabled: True
    patience: 10
    min_delta: 1e-4
    monitor: 'val_loss'

wandb:
  enabled: True
  project: 'pose-estimation'
  run_name: 'dinov3_vitpose'
  tags: ['dinov3', 'pose', 'pallet']

method:
  task: pose

  ECPose:
    backbone: DinoV3Adapter
    encoder: HybridEncoder
    decoder: DETRTransformer

  DinoV3Adapter:
    backbone: dinov3_vit_small
    weights_path: null
    proj_dim: 256
    finetuning: True

  HybridEncoder:
    in_channels: [256, 256, 256]
    feat_strides: [8, 16, 32]
    hidden_dim: 256
    use_encoder_idx: [2]
    num_encoder_layers: 1
    nhead: 8
    dim_feedforward: 1024
    dropout: 0.0
    expansion: 1.0
    depth_mult: 1
    act: silu
    csp_type: csp2
    fuse_op: sum

  DETRTransformer:
    hidden_dim: 256
    dropout: 0.0
    nhead: 8
    num_queries: 60
    dim_feedforward: 1024
    num_decoder_layers: 6
    normalize_before: False
    return_intermediate_dec: True
    activation: relu
    num_feature_levels: 3
    dec_n_points: 4
    learnable_tgt_init: True
    two_stage_type: standard
    num_body_points: 4
    aux_loss: True
    feat_strides: [8, 16, 32]
    reg_max: 32
    reg_scale: 4

  DETRPoseCriterion:
    num_classes: 12               # 11 fg + 1 bg
    weight_dict: {loss_vfl: 2.0, loss_keypoints: 10.0, loss_oks: 4.0}
    focal_alpha: 0.25
    losses: [vfl, keypoints]
    matcher:
      type: DETRPoseHungarianMatcher
      cost_class: 2.0
      cost_keypoints: 10.0
      cost_oks: 4.0
      focal_alpha: 0.25
    num_body_points: 4

  DETRPosePostProcessor:
    num_select: 60
    num_body_points: 4

kd:
  enabled: False

# === EC pipeline blocks ===

optimizer:
  type: AdamW
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.01
  params:
    - {params: '^(?=.*backbone)(?!.*(?:norm|bn|bias)).*$', lr: 0.00005}
    - {params: '^(?=.*backbone)(?=.*(?:norm|bn|bias)).*$', lr: 0.00005, weight_decay: 0.0}
    - {params: '^(?!.*backbone)(?=.*(?:norm|bn|bias)).*$', weight_decay: 0.0}

lr_scheduler:
  type: MultiStepLR
  milestones: [5000]
  gamma: 0.5

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500

ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000
  start: 0

scaler:
  type: GradScaler
  enabled: False

use_amp: True
use_ema: True
clip_max_norm: 0.1
print_freq: 50
checkpoint_freq: 5
sync_bn: True
find_unused_parameters: False

evaluator:
  type: CocoEvaluator
  iou_types: ['keypoints']
  verbose: False

train_dataloader:
  type: DataLoader
  dataset:
    type: YoloPoseDataset
    img_dir: /media/otter/otterHD/pallet_data/data_yolo/pose/pallet_260310_total/pallet_260310_640/train/images
    label_dir: /media/otter/otterHD/pallet_data/data_yolo/pose/pallet_260310_total/pallet_260310_640/train/labels
    nkpts: 4
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: ~
    stop_epoch: 80
  shuffle: True
  total_batch_size: 16
  num_workers: 8

val_dataloader:
  type: DataLoader
  dataset:
    type: YoloPoseDataset
    img_dir: /media/otter/otterHD/pallet_data/data_yolo/pose/pallet_260310_total/pallet_260310_640/valid/images
    label_dir: /media/otter/otterHD/pallet_data/data_yolo/pose/pallet_260310_total/pallet_260310_640/valid/labels
    nkpts: 4
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
  shuffle: False
  total_batch_size: 32
  num_workers: 8
