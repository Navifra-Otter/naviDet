# ============================================================
#  YOLO6DoF 설정 — 이 파일만 수정하면 학습/추론을 제어할 수 있다.
#  CLI override 예: --set train.epochs=50 data.imgsz=512
# ============================================================

data:
  train_root: "/home/naviserver02/work/otter/EdgeCrafter/datasets/mando_aug_merge/train"
  val_root:   "/home/naviserver02/work/otter/EdgeCrafter/datasets/mando_aug_merge/valid"
  ini:        "/home/naviserver02/work/otter/EdgeCrafter/datasets/mando_aug_merge/CameraParam_Orbbec Femto BoltCL8855300X5_Color1920x1080_Depth640x576.ini"
  # train_root: "/media/otter/otterHD/mando_aug/train"
  # val_root:   "/media/otter/otterHD/mando_aug/valid"
  # ini:        "/media/otter/otterHD/mando_aug/CameraParam_Orbbec Femto BoltCL8855300X5_Color1920x1080_Depth640x576.ini"
  depth_scale: 0.001          # depth PNG(uint16) → meter (mm이면 0.001)
  rmse_thresh: 0.05           # RANSAC 잔차 > 이 값(m)인 객체는 학습 제외
  imgsz: 640                  # 입력 해상도 (얇은 박스라 640 이상 권장)
  pose_mode: face             # GT 생성: face(테두리 띠 평면+GT코너 복원, full 6DoF, 권장) |
                              #          full(팔레트 전면) | bottom(cart 세로) | corners(4코너)
  use_cache: True             # pose_labels/*.npz 캐시 사용 여부. false면 매 epoch 즉석 GT
                              # (pose_mode 변경 직후엔 stale 캐시를 피하려 false 권장.
                              #  대량 학습 전엔 build_labels로 캐시를 굽고 true 로)
  nc: 1                       # 클래스 수
  class_names: [cart]

model:
  scale: m                    # n/s/m/l/x
  rot_repr: 6d                # 6d 또는 quat
  light_head: true            # true=경량 head, false=원본(무거운) head

train:
  epochs: 100
  batch: 32
  gpus: [2, 3]                  # 멀티 GPU: auto(전체) | 개수(예: 2) | id목록(예: [0,1]) — batch가 GPU 수로 분할됨
  lr: 1.0e-3
  weight_decay: 5.0e-4
  workers: 4
  amp: true                   # mixed precision
  limit: 0                    # 디버그용 프레임 제한 (0=전체)
  out: runs/6dof/mando_cart
  save_interval: 10           # 몇 epoch마다 체크포인트/곡선 저장 (best는 항상, 마지막은 항상)
  val_viz_num: 10              # 매 epoch 검증 시각화할 고정 샘플 수 (0=끔)

# 손실 가중치
loss:
  box: 7.5
  dfl: 1.5
  obj: 1.0
  cls: 0.5
  rot: 2.0
  size: 1.0
  depth: 1.0
  trans: 2.0

# 지식 증류 (DINOv3 → Student)
distill:
  teacher_ckpt: "checkpoints/dinov3/vit/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth"  # DINOv3 가중치(.pth) 로컬 경로(자동 다운로드는 403). 비우면 MockDINOv3
  repo_dir: ""                # 캐시된 DINOv3 레포 경로. 지정 시 source='local'로 GitHub 접근 생략(선택)
  hub_name: dinov3_vitb16     # torch.hub 모델명 (예: dinov3_vitb16). teacher_dim도 맞출 것
  teacher_dim: 768            # DINOv3 임베딩 차원 (ViT-S=384, B=768, L=1024) — vitb16이면 768
  patch_size: 16              # DINOv3 patch 크기
  num_register_tokens: 4      # 레지스터 토큰 수 (DINOv3=4, +CLS 1)
  teacher_imgsz: 640          # teacher 입력 크기 (patch_size 배수)
  loss: cosine                # 증류 손실: cosine | mse
  align: teacher              # 특징 grid 정렬 기준: teacher | student
  alpha0: 1.0                 # 초기 distill 비중 (→ 0 으로 감소)
  beta0: 0.3                  # 초기 task 비중
  beta1: 1.0                  # 후반 task 비중 (→ 증가)
  sched: cosine               # α 스케줄: cosine | linear

# 추론/시각화
predict:
  ckpt: runs/6dof/mando_cart/best.pt
  conf: 0.25                  # confidence 임계값 (실제 추론/정량평가)
  viz_conf: 0.05              # 학습 중 val_viz 전용 임계값 (낮춰 초기 epoch도 예측 표시)
  iou: 0.5                    # NMS IoU 임계값
  num: 12                     # 시각화할 프레임 수
  out: _pred
  seed: 0
  publish_json: true          # 결과를 _pred/preds.jsonl 로 발행
